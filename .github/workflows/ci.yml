name: Production validation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run build
      - name: Run standalone with isolated local database
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          export ADMIN_TEST_KEY=ci-only-synthetic-admin-key
          export ADMIN_KEY_HASH=$(node -e "process.stdout.write(require('node:crypto').createHash('sha256').update(process.env.ADMIN_TEST_KEY).digest('hex'))")
          HOSTNAME=127.0.0.1 PORT=3000 deno eval --unstable-kv "await import('./.next/standalone/server.js')" > /tmp/fidan-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/store/health && break; sleep 2; done
          node scripts/acceptance.mjs http://127.0.0.1:3000
      - name: Diagnostics
        if: failure()
        run: cat /tmp/fidan-server.log || true
